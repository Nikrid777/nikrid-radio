<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Nikrid — Sci-Fi Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon: #10B981; /* Default emerald */
      --bg-base: #000000;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow: hidden; 
    }

    /* Полное отключение любых системных рамок и обводок во всех состояниях */
    button, input {
      border: 0 !important;
      outline: none !important;
      box-shadow: none;
      -webkit-appearance: none;
      appearance: none;
    }
    button:focus, button:focus-visible, button:active,
    input:focus, input:focus-visible, input:active {
      outline: none !important;
      border: 0 !important;
    }

    /* Чёткий рендеринг обложек */
    img {
      image-rendering: -webkit-optimize-contrast;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    /* Динамические Неоновые Классы */
    .neon-text { color: var(--neon); text-shadow: 0 0 12px var(--neon); }
    .neon-bg { background-color: var(--neon); box-shadow: 0 0 15px var(--neon); }
    .neon-color { color: var(--neon); }
    
    .active-track-title {
      color: var(--neon);
      font-weight: 800;
    }

    /* Кнопки навигации */
    .nav-btn {
      background-color: transparent;
      color: rgba(255, 255, 255, 0.5);
      transition: background-color 0.16s ease, color 0.16s ease;
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: background-color, color;
    }
    @media (hover: hover) {
      .nav-btn:hover:not(.neon-nav-active) {
        background-color: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.92);
      }
    }
    .nav-btn.neon-nav-active {
      background-color: var(--neon) !important;
      color: #000000 !important;
      box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 32%, transparent);
    }
    .nav-btn.neon-nav-active svg {
      stroke: #000000 !important;
      fill: none;
    }

    /* Невидимый слой для мгновенного захвата ползунков мышью и пальцем */
    .range-overlay {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 100%;
      background: transparent;
      outline: none;
      margin: 0;
      padding: 0;
      cursor: pointer;
      opacity: 0;
      z-index: 20;
      touch-action: none;
    }

    /* Мгновенный отклик прогресс-бара без отставания полоски от кружка */
    #progress-fill, #progress-thumb, #vol-fill, #vol-thumb {
      transition: none !important;
      will-change: width, left;
    }

    /* Удобное перетаскивание треков в очереди: дочерние элементы не мешают курсору */
    .queue-item * {
      pointer-events: none;
    }
    .queue-item .queue-interactive {
      pointer-events: auto;
    }
    .queue-item.dragging-active {
      opacity: 0.35;
      background-color: rgba(255, 255, 255, 0.16) !important;
      border: 1px dashed var(--neon);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body class="h-[100dvh] flex flex-col select-none relative">

  <!-- НАСТОЯЩИЙ АУДИОДВИЖОК -->
  <audio id="audio-engine" preload="metadata"></audio>

  <!-- ФОН (ORBS, CIRCLES, PALM LEAVES) -->
  <div class="fixed top-1/4 left-1/4 w-[50vw] md:w-[30vw] h-[50vw] md:h-[30vw] rounded-full blur-[120px] md:blur-[150px] opacity-[0.05] pointer-events-none transition-colors duration-1000 z-0" style="background-color: var(--neon);"></div>
  <div class="fixed bottom-1/4 right-1/4 w-[60vw] md:w-[40vw] h-[60vw] md:h-[40vw] rounded-full blur-[120px] md:blur-[150px] opacity-[0.05] pointer-events-none transition-colors duration-1000 z-0" style="background-color: var(--neon);"></div>
  
  <div class="fixed top-[-20%] left-[-10%] w-[60vw] h-[60vw] rounded-full border border-white opacity-[0.02] pointer-events-none z-0"></div>
  <div class="fixed top-[-10%] left-[10%] w-[40vw] h-[40vw] rounded-full border border-white opacity-[0.02] pointer-events-none z-0"></div>
  
  <svg class="fixed bottom-0 right-0 w-[65vw] md:w-[45vw] h-auto opacity-[0.03] pointer-events-none z-0 text-white" viewBox="0 0 200 200" fill="currentColor">
    <path d="M200 200 C 150 140, 90 100, 0 90 C 70 100, 130 130, 170 180 Z" />
    <path d="M200 200 C 160 160, 120 120, 30 130 C 80 140, 140 160, 180 190 Z" />
    <path d="M200 200 C 180 150, 140 100, 60 70 C 100 90, 150 130, 190 170 Z" />
    <path d="M200 200 C 170 170, 130 140, 50 150 C 90 160, 150 180, 185 195 Z" />
  </svg>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ (HEADER) -->
  <header class="shrink-0 flex flex-wrap lg:flex-nowrap items-center justify-between px-4 sm:px-8 pt-3 pb-2.5 lg:py-0 lg:h-24 gap-y-2.5 relative z-30">
    <!-- Логотип Nikrid -->
    <div class="order-1 lg:w-1/4 flex items-center">
      <div class="flex items-center gap-2.5 sm:gap-3 cursor-pointer" onclick="switchTab('wave'); toggleSongPage(false);">
        <svg class="w-8 h-8 sm:w-9 sm:h-9 neon-text transition-colors duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 22V8m4 14V4m4 18v-8m4 8V10m4 12V2"/>
        </svg>
        <span class="font-extrabold text-xl sm:text-2xl tracking-[0.2em] uppercase neon-text transition-colors duration-500">Nikrid</span>
      </div>
    </div>

    <!-- ПОИСКОВИК -->
    <div class="order-3 lg:order-2 w-full lg:w-auto lg:flex-1 lg:max-w-lg lg:mx-auto z-40" id="searchContainer">
      <div class="relative flex items-center group w-full">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 absolute left-4 sm:left-5 text-white/50 group-focus-within:text-white transition-colors pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Поиск треков, альбомов и исполнителей..." 
               class="w-full h-10 sm:h-12 pl-11 sm:pl-14 pr-10 rounded-full bg-white/5 hover:bg-white/10 focus:bg-white/15 text-xs sm:text-sm text-white placeholder-white/40 transition-colors">
        <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-4 text-white/40 hover:text-white p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <!-- Выпадающий список -->
      <div id="searchDropdown" class="hidden absolute left-4 right-4 lg:left-1/2 lg:-translate-x-1/2 lg:w-full lg:max-w-lg mt-2 rounded-[1.75rem] bg-[#0A0A0A]/95 backdrop-blur-2xl py-2.5 z-50 max-h-80 overflow-y-auto shadow-[0_15px_40px_rgba(0,0,0,0.95)]">
        <div id="searchResults" class="flex flex-col"></div>
      </div>
    </div>

    <!-- Меню Настроений и Цветов -->
    <div class="order-2 lg:order-3 lg:w-1/4 flex items-center justify-end gap-2 sm:gap-3 relative z-50">
      <div class="relative" id="moodMenuWrapper">
        <button type="button" onclick="toggleMenu('moodMenu')" class="flex items-center gap-1.5 sm:gap-2 px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-full bg-white/5 hover:bg-white/10 active:bg-white/15 transition-colors text-xs sm:text-sm font-medium">
          <span id="currentMoodLabel" class="truncate max-w-[110px] sm:max-w-none">Весёлая</span>
          <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white/50 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="moodMenu" class="hidden absolute top-full right-0 mt-2.5 w-52 rounded-[1.75rem] bg-[#0A0A0A]/95 backdrop-blur-2xl py-2.5 z-50 shadow-[0_15px_40px_rgba(0,0,0,0.95)]">
          <button type="button" onclick="selectMood('Все настроения')" class="w-full text-left px-5 py-2.5 text-xs sm:text-sm text-white/70 hover:text-white hover:bg-white/10 transition-colors">Все настроения</button>
          <button type="button" onclick="selectMood('Весёлая')" class="w-full text-left px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors">Весёлая</button>
          <button type="button" onclick="selectMood('Грустная')" class="w-full text-left px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors">Грустная</button>
          <button type="button" onclick="selectMood('Официальная')" class="w-full text-left px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors">Официальная</button>
          <button type="button" onclick="selectMood('На фоне')" class="w-full text-left px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors">На фоне</button>
          <button type="button" onclick="selectMood('Тяжёлая')" class="w-full text-left px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors">Тяжёлая</button>
          <button type="button" onclick="selectMood('Русские весёлые')" class="w-full text-left px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors">Русские весёлые</button>
        </div>
      </div>

      <div class="relative" id="colorMenuWrapper">
        <button type="button" onclick="toggleMenu('colorMenu')" class="flex items-center gap-1.5 sm:gap-2 px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-full bg-white/5 hover:bg-white/10 active:bg-white/15 transition-colors text-xs sm:text-sm font-medium">
          <span class="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full transition-colors duration-500 neon-bg"></span>
          <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white/50 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="colorMenu" class="hidden absolute top-full right-0 mt-2.5 w-52 rounded-[1.75rem] bg-[#0A0A0A]/95 backdrop-blur-2xl py-2.5 z-50 shadow-[0_15px_40px_rgba(0,0,0,0.95)]">
          <button type="button" onclick="selectTheme('#E879C5')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#E879C5]"></span> Обсидиан</button>
          <button type="button" onclick="selectTheme('#E5C185')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#E5C185]"></span> Графит</button>
          <button type="button" onclick="selectTheme('#F7F7F9')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#F7F7F9]"></span> Молочный</button>
          <button type="button" onclick="selectTheme('#60A5FA')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#60A5FA]"></span> Северный</button>
          <button type="button" onclick="selectTheme('#EA580C')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#EA580C]"></span> Тёплый</button>
          <button type="button" onclick="selectTheme('#10B981')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#10B981]"></span> Изумрудный</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ -->
  <div class="flex flex-1 overflow-hidden z-10 relative">
    
    <!-- ЛЕВАЯ ПАНЕЛЬ (Sidebar) -->
    <aside class="hidden md:flex w-64 lg:w-72 shrink-0 flex-col p-6 gap-2">
      <nav class="flex flex-col gap-2 mt-2">
        <button type="button" onclick="switchTab('wave')" id="tab-wave" class="nav-btn neon-nav-active flex items-center gap-4 px-5 py-3.5 rounded-full font-medium">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/></svg>
          <span>Моя волна</span>
        </button>
        <button type="button" onclick="switchTab('playlist')" id="tab-playlist" class="nav-btn flex items-center gap-4 px-5 py-3.5 rounded-full font-medium">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Плейлист</span>
        </button>
        <button type="button" onclick="switchTab('buffer-like')" id="tab-like" class="nav-btn flex items-center gap-4 px-5 py-3.5 rounded-full font-medium">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
          <span class="truncate">Буфер: Лайк</span>
          <span id="badge-like" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-black/25 font-bold hidden">0</span>
        </button>
        <button type="button" onclick="switchTab('buffer-dislike')" id="tab-dislike" class="nav-btn flex items-center gap-4 px-5 py-3.5 rounded-full font-medium">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>
          <span class="truncate">Буфер: Дизлайк</span>
          <span id="badge-dislike" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-black/25 font-bold hidden">0</span>
        </button>
      </nav>
    </aside>

    <!-- КОНТЕНТ -->
    <main id="main-content" class="flex-1 overflow-y-scroll px-3.5 sm:px-8 lg:px-10 py-2 sm:py-6 pb-[165px] md:pb-36">
      <!-- Контент рендерится через JS -->
    </main>
  </div>

  <!-- МОБИЛЬНАЯ НАВИГАЦИЯ -->
  <nav id="mobile-nav" class="md:hidden fixed bottom-2.5 left-1/2 -translate-x-1/2 w-[95%] h-[54px] rounded-full bg-[#0A0A0A]/95 backdrop-blur-2xl z-30 flex items-center justify-between px-1.5 shadow-[0_10px_30px_rgba(0,0,0,0.9)]">
    <button type="button" onclick="switchTab('wave')" id="mob-tab-wave" class="nav-btn neon-nav-active flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-[11px] font-semibold">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/></svg>
      <span>Волна</span>
    </button>
    <button type="button" onclick="switchTab('playlist')" id="mob-tab-playlist" class="nav-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-[11px] font-semibold">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Плейлист</span>
    </button>
    <button type="button" onclick="switchTab('buffer-like')" id="mob-tab-like" class="nav-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-[11px] font-semibold">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
      <span>Лайк</span>
    </button>
    <button type="button" onclick="switchTab('buffer-dislike')" id="mob-tab-dislike" class="nav-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-[11px] font-semibold">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>
      <span>Дизлайк</span>
    </button>
  </nav>

  <!-- СТРАНИЦА ОТКРЫТОГО ТРЕКА -->
  <div id="song-page" class="fixed inset-0 z-40 bg-[#000000]/95 backdrop-blur-3xl flex flex-col lg:flex-row transition-transform duration-500 ease-out translate-y-full pt-3 sm:pt-6 lg:pt-20 pb-[96px] md:pb-[125px] px-4 sm:px-8 md:px-14 overflow-hidden">
    
    <!-- Мобильная шапка страницы песни -->
    <div class="flex lg:hidden items-center justify-between w-full mb-3 px-1 shrink-0">
      <button type="button" onclick="toggleSongPage(false)" class="p-2.5 rounded-full bg-white/5 text-white active:scale-95 transition">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
      </button>
      <div class="flex bg-white/5 p-1 rounded-full gap-1">
        <button type="button" onclick="switchMobileSongView('cover')" id="mob-view-cover" class="nav-btn neon-nav-active px-5 py-1.5 rounded-full text-xs font-bold">Трек</button>
        <button type="button" onclick="switchMobileSongView('queue')" id="mob-view-queue" class="nav-btn px-5 py-1.5 rounded-full text-xs font-bold">Очередь</button>
      </div>
      <button type="button" onclick="toggleRepeat()" id="mob-btn-repeat" class="p-2.5 rounded-full bg-white/5 text-gray-400 transition">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <div class="w-full flex-1 max-w-[1550px] mx-auto flex flex-col lg:flex-row items-center gap-6 lg:gap-14 overflow-hidden">
      
      <!-- Left: Крупная обложка (неподвижная) + Живая светомузыка позади неё -->
      <div id="sp-left-panel" class="flex lg:!flex flex-1 flex-col items-center justify-center w-full h-full overflow-hidden">
        
        <div class="relative flex items-center justify-center my-4">
          <!-- Динамическая тень-светомузыка позади обложки (управляется из JS) -->
          <div id="sp-cover-glow" class="absolute -inset-6 rounded-[2.8rem] opacity-30 blur-2xl pointer-events-none will-change-transform" style="background: var(--neon);"></div>
          
          <!-- Сама обложка теперь стоит чётко и неподвижно -->
          <div id="sp-cover-wrap" class="relative w-[54vw] h-[54vw] max-w-[240px] max-h-[240px] sm:max-w-[310px] sm:max-h-[310px] lg:max-w-[430px] lg:max-h-[430px] lg:w-[44vh] lg:h-[44vh] rounded-[2rem] overflow-hidden shadow-[0_25px_70px_rgba(0,0,0,0.9)] bg-white/5 shrink-0 z-10">
            <img id="sp-cover-img" src="" alt="Album Cover" class="w-full h-full object-cover" onerror="handleImgError(this)">
            <div id="sp-cover-mood" class="absolute top-3.5 left-3.5 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-black/65 backdrop-blur-md text-[var(--neon)]">
              Весёлая
            </div>
          </div>
        </div>

        <!-- Информация о текущей песне и спектр звука -->

  <script>
    const STORAGE_KEY = 'nikrid_radio_state_v2';
    const DRIVE_API_KEY = 'AIzaSyBtgyeKpROB8ulqpLxFVAuS1AmDHovAo84';

    // Повышение чёткости обложек YouTube / GoogleUserContent / Unsplash до HD
// Безопасное повышение чёткости обложек
    function upgradeImageResolution(url) {
      if (!url || typeof url !== 'string') {
        return 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1000&q=90';
      }
      let hd = url;
      // Для YouTube Music / GoogleUserContent аккуратно увеличиваем размер до 544x544 (стандартный размер обложек YTM)
      if (hd.includes('googleusercontent.com') || hd.includes('ggpht.com')) {
        hd = hd.replace(/=w\d+-h\d+[^&?]*/g, '=w544-h544-l90-rj');
        hd = hd.replace(/=s\d+[^&?]*/g, '=s544');
      }
      // Для обычного YouTube убираем только сжатие ?sqp=..., оставляя гарантированно существующий hqdefault.jpg
      if (hd.includes('ytimg.com')) {
        hd = hd.split('?')[0];
      }
      // Unsplash
      if (hd.includes('images.unsplash.com')) {
        hd = hd.replace(/w=\d+/g, 'w=1000').replace(/q=\d+/g, 'q=90');
      }
      return hd;
    }

    let TRACKS = [
      { id: 1, title: 'Midnight City Lights', artist: 'M83 & Waves', duration: '3:20', seconds: 200, moods: ['Весёлая', 'На фоне'], image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1000&q=90', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
      { id: 2, title: 'Осенний дождь на стекле', artist: 'Сироткин', duration: '3:48', seconds: 228, moods: ['Грустная', 'На фоне'], image: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&w=1000&q=90', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
      { id: 3, title: 'Iron Riffs & Thunder', artist: 'Bring Me The Horizon', duration: '3:36', seconds: 216, moods: ['Тяжёлая'], image: 'https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?auto=format&fit=crop&w=1000&q=90', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
      { id: 4, title: 'Golden Hour Drive', artist: 'Parcels', duration: '3:08', seconds: 188, moods: ['Весёлая', 'На фоне'], image: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1000&q=90', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
      { id: 5, title: 'Symphony of Glass', artist: 'Max Richter', duration: '4:30', seconds: 270, moods: ['Официальная', 'Грустная'], image: 'https://images.unsplash.com/photo-1507838153414-b4b713384a76?auto=format&fit=crop&w=1000&q=90', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' },
      { id: 6, title: 'Neon Pulse', artist: 'Kavinsky', duration: '4:10', seconds: 250, moods: ['Весёлая', 'Тяжёлая'], image: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1000&q=90', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3' }
    ];

    let state = {
      activeTab: 'wave',
      mood: 'Весёлая',
      theme: '#10B981',
      currentTrack: TRACKS[0],
      isPlaying: false,
      progress: 0,
      isDraggingProgress: false,
      volume: 70,
      prevVolume: 70,
      isMuted: false,
      fallbackTimerId: null,
      usingFallbackTimer: false,
      retriedAltUrl: false,
      bufferLikes: [],
      bufferDislikes: [],
      history: [...TRACKS.slice(0, 6)],
      repeat: false,
      shuffle: false,
      isSongPageOpen: false,
      mobileSongView: 'cover',
      queue: [...TRACKS],
      customQueueOrder: TRACKS.map(t => t.id)
    };

    const audio = document.getElementById('audio-engine');

    // Если у ролика YouTube нет maxresdefault.jpg, аккуратно откатываемся на hqdefault.jpg, а при полном сбое — на SVG
function handleImgError(imgEl) {
      // 1. Если есть сохранённый оригинал и мы его ещё не пробовали — откатываемся на него
      const orig = imgEl.getAttribute('data-orig');
      if (orig && imgEl.src !== orig && !imgEl.dataset.triedOrig) {
        imgEl.dataset.triedOrig = '1';
        imgEl.src = orig;
        return;
      }
      // 2. Если был maxresdefault — пробуем hqdefault
      if (imgEl.src && imgEl.src.includes('maxresdefault.jpg')) {
        imgEl.src = imgEl.src.replace('maxresdefault.jpg', 'hqdefault.jpg');
        return;
      }
      // 3. Крайний случай — стильная виниловая заглушка
      imgEl.onerror = null;
      imgEl.src = "data:image/svg+xml;utf8," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#1f2937"/>
              <stop offset="100%" stop-color="#090d16"/>
            </linearGradient>
          </defs>
          <rect width="200" height="200" fill="url(#g)"/>
          <circle cx="100" cy="100" r="56" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
          <circle cx="100" cy="100" r="16" fill="rgba(255,255,255,0.2)"/>
        </svg>
      `);
    }

    function saveState() {
      try {
        const payload = {
          mood: state.mood,
          theme: state.theme,
          currentTrackId: state.currentTrack ? state.currentTrack.id : 1,
          volume: state.volume,
          prevVolume: state.prevVolume,
          isMuted: state.isMuted,
          repeat: state.repeat,
          shuffle: state.shuffle,
          likeIds: state.bufferLikes.map(t => t.id),
          dislikeIds: state.bufferDislikes.map(t => t.id),
          historyIds: state.history.map(t => t.id),
          customQueueOrder: state.customQueueOrder,
          queueIds: state.queue.map(t => t.id)
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);

        if (data.theme) {
          state.theme = data.theme;
          document.documentElement.style.setProperty('--neon', data.theme);
        }
        if (data.mood) {
          state.mood = data.mood;
          document.getElementById('currentMoodLabel').textContent = data.mood;
        }
        if (typeof data.volume === 'number') state.volume = data.volume;
        if (typeof data.prevVolume === 'number') state.prevVolume = data.prevVolume;
        if (typeof data.isMuted === 'boolean') state.isMuted = data.isMuted;
        if (typeof data.repeat === 'boolean') state.repeat = data.repeat;
        if (typeof data.shuffle === 'boolean') state.shuffle = data.shuffle;

        if (Array.isArray(data.likeIds)) {
          state.bufferLikes = data.likeIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
        }
        if (Array.isArray(data.dislikeIds)) {
          state.bufferDislikes = data.dislikeIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
        }
        if (Array.isArray(data.historyIds) && data.historyIds.length > 0) {
          state.history = data.historyIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
        }
        if (Array.isArray(data.customQueueOrder) && data.customQueueOrder.length > 0) {
          state.customQueueOrder = data.customQueueOrder;
        }
        if (Array.isArray(data.queueIds) && data.queueIds.length > 0) {
          const restoredQueue = data.queueIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
          if (restoredQueue.length > 0) state.queue = restoredQueue;
        }
        if (data.currentTrackId) {
          const found = TRACKS.find(t => t.id === data.currentTrackId);
          if (found) state.currentTrack = found;
        }
      } catch (e) {}
    }

    async function tryLoadLocalPlaylistJson() {
      try {
        const res = await fetch('playlist.json', { cache: 'no-store' });
        if (!res.ok) return;
        const json = await res.json();
        if (Array.isArray(json) && json.length > 0) {
          TRACKS = json.map((item, idx) => {
            let rawUrl = item.audioUrl || item.url || item.file || '';
            const idMatch = rawUrl.match(/[-\w]{25,}/);
            const driveId = idMatch ? idMatch[0] : null;
            if (driveId && (rawUrl.includes('drive.google.com') || rawUrl.includes('googleusercontent.com'))) {
              rawUrl = `https://www.googleapis.com/drive/v3/files/${driveId}?alt=media&key=${DRIVE_API_KEY}`;
            }

            const rawImg = item.image || item.cover || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1000&q=90';

            return {
              id: item.id || idx + 1,
              driveId: driveId,
              title: item.title || 'Без названия',
              artist: item.artist || 'Неизвестный исполнитель',
              duration: item.duration || '3:30',
              seconds: item.seconds || 210,
              moods: Array.isArray(item.moods) ? item.moods : ['Весёлая'],
              image: upgradeImageResolution(rawImg),
              audioUrl: rawUrl
            };
          });
          state.queue = [...TRACKS];
          state.customQueueOrder = TRACKS.map(t => t.id);
          state.currentTrack = TRACKS[0];
          state.history = TRACKS.slice(0, 6);
          loadState();
          renderContent();
          updatePlayerUI();
        }
      } catch (e) {}
    }

    function initAudioEngine() {
      audio.addEventListener('timeupdate', () => {
        if (state.isDraggingProgress || state.usingFallbackTimer || !audio.duration || isNaN(audio.duration)) return;
        state.progress = (audio.currentTime / audio.duration) * 100;
        syncProgressUI();
      });

      audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && !isNaN(audio.duration)) {
          state.currentTrack.seconds = Math.floor(audio.duration);
          const m = Math.floor(state.currentTrack.seconds / 60);
          const s = String(state.currentTrack.seconds % 60).padStart(2, '0');
          state.currentTrack.duration = `${m}:${s}`;
          document.getElementById('time-total').textContent = state.currentTrack.duration;
        }
      });

      audio.addEventListener('ended', () => {
        if (state.repeat) {
          playTrack(state.currentTrack.id, false);
        } else {
          nextTrack();
        }
      });

      audio.addEventListener('error', () => {
        if (state.isPlaying && state.currentTrack && state.currentTrack.driveId && !state.retriedAltUrl) {
          state.retriedAltUrl = true;
          audio.src = `https://www.googleapis.com/drive/v3/files/${state.currentTrack.driveId}?alt=media&key=${DRIVE_API_KEY}`;
          audio.play().catch(() => {
            state.usingFallbackTimer = true;
            startFallbackTimer();
          });
          return;
        }
        if (state.isPlaying) {
          state.usingFallbackTimer = true;
          startFallbackTimer();
        }
      });
    }

    function init() {
      loadState();
      initAudioEngine();
      tryLoadLocalPlaylistJson();

      window.addEventListener('pointerup', () => {
        if (state.isDraggingProgress) {
          state.isDraggingProgress = false;
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#moodMenuWrapper')) {
          document.getElementById('moodMenu').classList.add('hidden');
        }
        if (!e.target.closest('#colorMenuWrapper')) {
          document.getElementById('colorMenu').classList.add('hidden');
        }
        if (!e.target.closest('#searchContainer')) {
          document.getElementById('searchDropdown').classList.add('hidden');
        }
      });

      document.addEventListener('keydown', (e) => {
        if (document.activeElement === document.getElementById('searchInput')) return;
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'KeyM') {
          toggleMute();
        } else if (e.code === 'ArrowRight') {
          seekTrack(Math.min(100, state.progress + 3), true);
        } else if (e.code === 'ArrowLeft') {
          seekTrack(Math.max(0, state.progress - 3), true);
        }
      });

      syncToggleButtonsUI();
      renderContent();
      updatePlayerUI();
      updateVolumeUI();
      startVisualizerLoop();
      startSmoothProgressLoop();
    }

    // 60 FPS плавная синхронизация прогресс-бара во время проигрывания
    function startSmoothProgressLoop() {
      function tick() {
        if (state.isPlaying && !state.isDraggingProgress && !state.usingFallbackTimer && audio.duration && !isNaN(audio.duration)) {
          state.progress = (audio.currentTime / audio.duration) * 100;
          syncProgressUI();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function toggleMenu(id) {
      const otherId = id === 'moodMenu' ? 'colorMenu' : 'moodMenu';
      document.getElementById(otherId).classList.add('hidden');
      document.getElementById(id).classList.toggle('hidden');
    }

    function selectTheme(colorHex) {
      state.theme = colorHex;
      document.documentElement.style.setProperty('--neon', colorHex);
      document.getElementById('colorMenu').classList.add('hidden');

      renderContent();
    }

    function getFilteredTracksByMood(moodName) {
      if (!moodName || moodName === 'Все настроения') return [...TRACKS];
      const exact = TRACKS.filter(t => Array.isArray(t.moods) && t.moods.includes(moodName));
      return exact.length > 0 ? exact : [...TRACKS];
    }

      state.mood = moodName;

    function startWaveStream() {
      const moodTracks = getFilteredTracksByMood(state.mood);
      const isCurrentInMood = moodTracks.some(t => t.id === (state.currentTrack && state.currentTrack.id));
      if (!isCurrentInMood && moodTracks.length > 0) {
        state.queue = [...moodTracks, ...TRACKS.filter(t => !moodTracks.some(m => m.id === t.id))];
        state.customQueueOrder = state.queue.map(t => t.id);
        playTrack(moodTracks[0].id);
        return;
      }
      if (state.isPlaying) {
        togglePlay();
      } else {
        playTrack(state.currentTrack ? state.currentTrack.id : moodTracks[0].id);
      }
    }

    function renderGridCard(track) {

          <div class="flex flex-col min-w-0 flex-1">

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const dropdown = document.getElementById('searchDropdown');
      const resultsContainer = document.getElementById('searchResults');
      const clearBtn = document.getElementById('clearSearchBtn');
      
      clearBtn.classList.toggle('hidden', q.length === 0);
      if (q.length === 0) { dropdown.classList.add('hidden'); return; }
      
      const results = TRACKS.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
      
      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="px-6 py-4 text-white/50 text-sm">Ничего не найдено</div>';
      } else {
        resultsContainer.innerHTML = results.map(t => `
          <button type="button" onclick="playTrack(${t.id}); clearSearch();" class="w-full flex items-center gap-3.5 px-5 py-2.5 hover:bg-white/10 active:bg-white/15 transition-colors text-left group">
            <div class="w-10 h-10 rounded-xl overflow-hidden shrink-0 bg-white/5">
              <img src="${t.image}" alt="${t.title}" class="w-full h-full object-cover" onerror="handleImgError(this)">
            </div>
            <div class="min-w-0 flex-1">
              <div class="font-medium text-sm truncate text-white/90 group-hover:text-white">${t.title}</div>
              <div class="text-xs truncate text-white/50 mt-0.5">${t.artist}</div>
            </div>
            <span class="text-xs text-white/30 tabular-nums">${t.duration}</span>
          </button>
        `).join('');
      }
      dropdown.classList.remove('hidden');
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('searchDropdown').classList.add('hidden');
    }

    function recordTrackInHistory(track) {
      if (!track) return;
      state.history = [track, ...state.history.filter(t => t.id !== track.id)].slice(0, 8);
    }

    function playTrack(id, recordHistory = true) {
      const found = state.queue.find(t => t.id === id) || TRACKS.find(t => t.id === id);
      if (!found) return;

      state.currentTrack = found;
      state.progress = 0;
      state.isPlaying = true;
      state.usingFallbackTimer = false;
      state.retriedAltUrl = false;
      clearInterval(state.fallbackTimerId);

      if (recordHistory) {
        recordTrackInHistory(found);
      }

      if (found.audioUrl) {
        if (audio.src !== found.audioUrl) {
          audio.src = found.audioUrl;
        }
        audio.currentTime = 0;
        audio.volume = state.isMuted ? 0 : state.volume / 100;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            if (found.driveId && !state.retriedAltUrl) {
              state.retriedAltUrl = true;
              audio.src = `https://www.googleapis.com/drive/v3/files/${found.driveId}?alt=media&key=${DRIVE_API_KEY}`;
              audio.play().catch(() => {
                state.usingFallbackTimer = true;
                startFallbackTimer();
              });
            } else {
              state.usingFallbackTimer = true;
              startFallbackTimer();
            }
          });
        }
      } else {
        state.usingFallbackTimer = true;
        startFallbackTimer();
      }

      saveState();
      updatePlayerUI();
      renderContent();
    }

    function togglePlay() {
      if(!state.currentTrack) return;
      state.isPlaying = !state.isPlaying;

      if (state.isPlaying) {
        if (!audio.src && state.currentTrack.audioUrl) {
          audio.src = state.currentTrack.audioUrl;
        }
        if (state.usingFallbackTimer || !state.currentTrack.audioUrl) {
          startFallbackTimer();
        } else {
          const p = audio.play();
          if (p !== undefined) {
            p.catch(() => {
              state.usingFallbackTimer = true;
              startFallbackTimer();
            });
          }
        }
      } else {
        audio.pause();
        clearInterval(state.fallbackTimerId);
      }

      updatePlayerUI();
      renderContent();
    }

    function nextTrack() {
      const idx = state.queue.findIndex(t => t.id === state.currentTrack.id);
      const nextIdx = (idx + 1) % state.queue.length;
      playTrack(state.queue[nextIdx].id);
    }

    function prevTrack() {
      const curSec = (state.progress / 100) * (state.currentTrack ? state.currentTrack.seconds : 0);
      if (curSec > 3) {
        seekTrack(0, true);
        return;
      }
      const idx = state.queue.findIndex(t => t.id === state.currentTrack.id);
      const prevIdx = (idx - 1 + state.queue.length) % state.queue.length;
      playTrack(state.queue[prevIdx].id);
    }

    function actionLike() {
      if(!state.currentTrack) return;
      actionLikeBtn(state.currentTrack.id);
    }

    function actionDislike() {
      if(!state.currentTrack) return;
      actionDislikeBtn(state.currentTrack.id);
    }

    function actionLikeBtn(id) {
      const track = TRACKS.find(t => t.id === id);
      if(!track) return;
      const exists = state.bufferLikes.some(t => t.id === id);
      if (exists) {
        state.bufferLikes = state.bufferLikes.filter(t => t.id !== id);
      } else {
        state.bufferLikes.push(track);
        state.bufferDislikes = state.bufferDislikes.filter(t => t.id !== id);
      }
      saveState();
      updatePlayerUI();
      renderContent();
    }

    function actionDislikeBtn(id) {
      const track = TRACKS.find(t => t.id === id);
      if(!track) return;
      const exists = state.bufferDislikes.some(t => t.id === id);
      if (exists) {
        state.bufferDislikes = state.bufferDislikes.filter(t => t.id !== id);
      } else {
        state.bufferDislikes.push(track);
        state.bufferLikes = state.bufferLikes.filter(t => t.id !== id);
      }
      saveState();
      updatePlayerUI();
      renderContent();
    }

    // Быстрая и отзывчивая перемотка без отставания полоски от ползунка
    function startSeekDrag() {
      state.isDraggingProgress = true;
    }

    function seekTrack(val, commitAudio = false) {
      state.progress = Math.max(0, Math.min(100, Number(val)));
      syncProgressUI();

      if (!state.usingFallbackTimer && audio.duration && !isNaN(audio.duration)) {
        audio.currentTime = (state.progress / 100) * audio.duration;
      }
      if (commitAudio) {
        state.isDraggingProgress = false;
      }
    }

    function syncProgressUI() {
      const pct = state.progress + '%';
      document.getElementById('progress-slider').value = state.progress;
      document.getElementById('progress-fill').style.width = pct;
      document.getElementById('progress-thumb').style.left = pct;
      updateTime();
    }

    function setVolume(val) {
      const num = Math.max(0, Math.min(100, Number(val)));
      state.volume = num;
      if (num > 0) {
        state.prevVolume = num;
        state.isMuted = false;
      } else {
        state.isMuted = true;
      }
      audio.volume = state.isMuted ? 0 : state.volume / 100;
      saveState();
      updateVolumeUI();
    }

    function handleVolumeWheel(e) {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 5 : -5;
      const current = state.isMuted ? 0 : state.volume;
      setVolume(current + delta);
    }

    function toggleMute() {
      if (state.isMuted || state.volume === 0) {
        state.isMuted = false;
        state.volume = state.prevVolume > 0 ? state.prevVolume : 70;
      } else {
        state.prevVolume = state.volume;
        state.isMuted = true;
      }
      audio.volume = state.isMuted ? 0 : state.volume / 100;
      saveState();
      updateVolumeUI();
    }

    function updateVolumeUI() {
      const effectiveVol = state.isMuted ? 0 : state.volume;
      const slider = document.getElementById('vol-slider');
      const fill = document.getElementById('vol-fill');
      const thumb = document.getElementById('vol-thumb');
      if (slider) slider.value = effectiveVol;
      if (fill) fill.style.width = effectiveVol + '%';
      if (thumb) thumb.style.left = effectiveVol + '%';
      
      const volIcon = document.getElementById('vol-icon');
      if (!volIcon) return;
      if (effectiveVol === 0) {
        volIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      } else if (effectiveVol < 50) {
        volIcon.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
      } else {
        volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }
    }

    function startFallbackTimer() {
      clearInterval(state.fallbackTimerId);
      state.fallbackTimerId = setInterval(() => {
        if (!state.isPlaying || !state.currentTrack || state.isDraggingProgress) return;
        const step = 100 / (state.currentTrack.seconds * 10);
        state.progress += step;
        if(state.progress >= 100) {
          if (state.repeat) {
            playTrack(state.currentTrack.id, false);
          } else {
            nextTrack();
          }
        } else {
          syncProgressUI();
        }
      }, 100);
    }

    function updateTime() {
      if(!state.currentTrack) return;
      const totalSec = (!state.usingFallbackTimer && audio.duration && !isNaN(audio.duration))
        ? audio.duration
        : state.currentTrack.seconds;
      const curSec = Math.floor((state.progress / 100) * totalSec);
      const m = Math.floor(curSec / 60);
      const s = String(curSec % 60).padStart(2, '0');
      document.getElementById('time-current').textContent = `${m}:${s}`;
    }

    function updatePlayerUI() {
      const t = state.currentTrack;
      if(!t) return;
      const hdImage = upgradeImageResolution(t.image);
      document.getElementById('player-title').textContent = t.title;
      document.getElementById('player-artist').textContent = t.artist;
      document.getElementById('player-cover-img').src = hdImage;
      document.getElementById('time-total').textContent = t.duration;
      
      document.getElementById('sp-cover-img').src = hdImage;
      document.getElementById('sp-main-title').textContent = t.title;
      document.getElementById('sp-main-artist').textContent = t.artist;
      document.getElementById('sp-cover-mood').textContent = (t.moods && t.moods[0]) ? t.moods[0] : state.mood;
      document.getElementById('sp-source').textContent = state.activeTab === 'wave' ? `Моя волна (${state.mood})` : 'Плейлист';

      const likeBtn = document.getElementById('player-like-btn');
      const dislikeBtn = document.getElementById('player-dislike-btn');
      const mobLikeBtn = document.getElementById('sp-mob-like');
      const mobDislikeBtn = document.getElementById('sp-mob-dislike');
      
      const isLiked = state.bufferLikes.some(track => track.id === t.id);
      const isDisliked = state.bufferDislikes.some(track => track.id === t.id);

      const likeSvg = isLiked 
        ? '<svg class="w-5 h-5 neon-color" fill="currentColor" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>'
        : '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>';
        
      const dislikeSvg = isDisliked 
        ? '<svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>'
        : '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>';

      if (likeBtn) likeBtn.innerHTML = likeSvg;
      if (dislikeBtn) dislikeBtn.innerHTML = dislikeSvg;
      if (mobLikeBtn) mobLikeBtn.innerHTML = likeSvg;
      if (mobDislikeBtn) mobDislikeBtn.innerHTML = dislikeSvg;

      document.getElementById('icon-play').classList.toggle('hidden', state.isPlaying);
      document.getElementById('icon-pause').classList.toggle('hidden', !state.isPlaying);
      
      syncProgressUI();
      renderQueue();
    }

    function syncToggleButtonsUI() {
      ['btn-repeat', 'mob-btn-repeat'].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.classList.toggle('text-[var(--neon)]', state.repeat);
        btn.classList.toggle('text-gray-500', !state.repeat);
        btn.classList.toggle('text-gray-400', !state.repeat);
      });

      ['btn-shuffle', 'sp-mob-shuffle'].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.classList.toggle('text-[var(--neon)]', state.shuffle);
        btn.classList.toggle('text-gray-500', !state.shuffle);
        btn.classList.toggle('text-gray-400', !state.shuffle);
      });

      const spBtn = document.getElementById('sp-btn-shuffle');
      const spLabel = document.getElementById('sp-shuffle-label');
      if (spBtn && spLabel) {
        spBtn.classList.toggle('neon-nav-active', state.shuffle);
        spLabel.textContent = state.shuffle ? 'Перемешано' : 'Перемешать';
      }
    }

    function toggleRepeat() {
      state.repeat = !state.repeat;
      syncToggleButtonsUI();
      saveState();
    }

    function toggleShuffle() {
      state.shuffle = !state.shuffle;
      
      if (state.shuffle) {
        state.customQueueOrder = state.queue.map(t => t.id);
        const others = state.queue.filter(t => t.id !== state.currentTrack.id);
        for (let i = others.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [others[i], others[j]] = [others[j], others[i]];
        }
        state.queue = [state.currentTrack, ...others];
      } else {
        const restored = state.customQueueOrder
          .map(id => TRACKS.find(t => t.id === id))
          .filter(Boolean);
        state.queue = restored.length > 0 ? restored : [...TRACKS];
      }

      syncToggleButtonsUI();
      saveState();
      renderQueue();
    }

    function toggleSongPage(force) {
      if (force !== undefined) state.isSongPageOpen = force;
      else state.isSongPageOpen = !state.isSongPageOpen;

      const page = document.getElementById('song-page');
      const footer = document.getElementById('player-footer');
      const chevron = document.getElementById('player-chevron');

      if (state.isSongPageOpen) {
        page.classList.remove('translate-y-full');
        page.classList.add('translate-y-0');
        footer.classList.remove('bottom-[66px]');
        footer.classList.add('bottom-3');
        if (chevron) chevron.classList.remove('rotate-180');
      } else {
        page.classList.add('translate-y-full');
        page.classList.remove('translate-y-0');
        footer.classList.add('bottom-[66px]');
        footer.classList.remove('bottom-3');
        if (chevron) chevron.classList.add('rotate-180');
      }
    }

    function moveQueueItem(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= state.queue.length) return;
      const temp = state.queue[index];
      state.queue[index] = state.queue[targetIndex];
      state.queue[targetIndex] = temp;
      if (!state.shuffle) {
        state.customQueueOrder = state.queue.map(t => t.id);
      }
      saveState();
      renderQueue();
    }

    // Визуализатор + живая светомузыка тени позади обложки (обложка стоит на месте)
    function startVisualizerLoop() {
      const canvas = document.getElementById('audio-visualizer');
      const glowEl = document.getElementById('sp-cover-glow');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const bars = 28;
      const heights = new Array(bars).fill(4);
      let smoothEnergy = 0;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const neonColor = getComputedStyle(document.documentElement).getPropertyValue('--neon').trim() || '#10B981';
        const barWidth = 5;
        const gap = 4;
        const totalWidth = bars * barWidth + (bars - 1) * gap;
        const startX = (canvas.width - totalWidth) / 2;
        const now = performance.now() / 150;

        let energySum = 0;

        for (let i = 0; i < bars; i++) {
          let target = 4;
          if (state.isPlaying && !state.isMuted && state.volume > 0) {
            const centerFactor = 1 - Math.abs(i - bars / 2) / (bars / 2);
            const wave = Math.sin(now + i * 0.55) * 0.5 + 0.5;
            const pulse = Math.cos(now * 1.65 - i * 0.35) * 0.5 + 0.5;
            const bassKick = Math.pow(Math.sin(now * 0.9) * 0.5 + 0.5, 2);
            target = Math.max(4, (wave * 0.5 + pulse * 0.3 + bassKick * 0.2) * centerFactor * 34 * (state.volume / 100) + 4);
          }
          heights[i] += (target - heights[i]) * 0.25;
          energySum += heights[i];

          const h = heights[i];
          const x = startX + i * (barWidth + gap);
          const y = (canvas.height - h) / 2;

          ctx.fillStyle = neonColor;
          ctx.globalAlpha = state.isPlaying ? 0.88 : 0.25;
          ctx.beginPath();
          ctx.roundRect(x, y, barWidth, h, 3);
          ctx.fill();
        }

        // Анимация тени-светомузыки позади обложки (сама обложка неподвижна)
        if (glowEl) {
          const avgEnergy = (energySum / bars - 4) / 22; // 0..1
          smoothEnergy += (avgEnergy - smoothEnergy) * 0.18;

          if (state.isPlaying && !state.isMuted && state.volume > 0) {
            const scale = 1.02 + smoothEnergy * 0.26;
            const shiftX = Math.sin(now * 0.7) * (10 + smoothEnergy * 14);
            const shiftY = Math.cos(now * 0.55) * (10 + smoothEnergy * 14);
            const blurPx = Math.round(28 + smoothEnergy * 34);
            const opacity = Math.min(0.85, 0.32 + smoothEnergy * 0.5);

            glowEl.style.transform = `translate3d(${shiftX.toFixed(1)}px, ${shiftY.toFixed(1)}px, 0) scale(${scale.toFixed(3)})`;
            glowEl.style.filter = `blur(${blurPx}px)`;
            glowEl.style.opacity = opacity.toFixed(2);
            glowEl.style.background = neonColor;
          } else {
            glowEl.style.transform = 'translate3d(0px, 0px, 0) scale(0.96)';
            glowEl.style.filter = 'blur(26px)';
            glowEl.style.opacity = '0.18';
            glowEl.style.background = neonColor;
          }
        }

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }

    // УЛУЧШЕННОЕ ПЕРЕТАСКИВАНИЕ ОЧЕРЕДИ С АВТОСКРОЛЛОМ И ЖИВОЙ СОРТИРОВКОЙ
    let draggedTrackId = null;
    let autoScrollVelocity = 0;
    let autoScrollFrame = null;

    function runQueueAutoScroll() {
      const container = document.getElementById('sp-queue');
      if (!container || !draggedTrackId) {
        autoScrollFrame = null;
        return;
      }
      if (autoScrollVelocity !== 0) {
        container.scrollTop += autoScrollVelocity;
      }
      autoScrollFrame = requestAnimationFrame(runQueueAutoScroll);
    }

    function handleQueueContainerDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const container = document.getElementById('sp-queue');
      if (!container || !draggedTrackId) return;

      // Широкая зона автопрокрутки (90px сверху и снизу контейнера очереди)
      const rect = container.getBoundingClientRect();
      const edgeSize = 90;
      const y = e.clientY;

      if (y < rect.top + edgeSize) {
        const intensity = Math.max(0.15, (rect.top + edgeSize - y) / edgeSize);
        autoScrollVelocity = -Math.round(intensity * 16);
      } else if (y > rect.bottom - edgeSize) {
        const intensity = Math.max(0.15, (y - (rect.bottom - edgeSize)) / edgeSize);
        autoScrollVelocity = Math.round(intensity * 16);
      } else {
        autoScrollVelocity = 0;
      }

      // Находим карточку под курсором и сразу меняем местами в реальном времени
      const targetItem = e.target.closest('.queue-item');
      if (!targetItem) return;

      const targetId = parseInt(targetItem.dataset.id);
      if (!targetId || targetId === draggedTrackId) return;

      const itemRect = targetItem.getBoundingClientRect();
      const midpoint = itemRect.top + itemRect.height / 2;

      const draggedIdx = state.queue.findIndex(t => t.id === draggedTrackId);
      const targetIdx = state.queue.findIndex(t => t.id === targetId);
      if (draggedIdx === -1 || targetIdx === -1) return;

      // Переставляем сразу, когда курсор пересёк середину соседнего элемента
      if ((draggedIdx < targetIdx && y > midpoint - 6) || (draggedIdx > targetIdx && y < midpoint + 6)) {
        const [moved] = state.queue.splice(draggedIdx, 1);
        state.queue.splice(targetIdx, 0, moved);
        state.customQueueOrder = state.queue.map(t => t.id);
        renderQueue();
      }
    }

    function handleDragStart(e) {
      draggedTrackId = parseInt(this.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(draggedTrackId));
      setTimeout(() => {
        this.classList.add('dragging-active');
      }, 0);
      if (!autoScrollFrame) {
        autoScrollFrame = requestAnimationFrame(runQueueAutoScroll);
      }
    }

    function handleDragEnd() {
      draggedTrackId = null;
      autoScrollVelocity = 0;
      if (autoScrollFrame) {
        cancelAnimationFrame(autoScrollFrame);
        autoScrollFrame = null;
      }
      saveState();
      renderQueue();
    }

    function renderQueue() {
      const container = document.getElementById('sp-queue');
      if(!container) return;

      const isDesktop = window.matchMedia('(min-width: 1024px)').matches;

      container.ondragover = isDesktop ? handleQueueContainerDragOver : null;
      container.ondrop = isDesktop ? (e) => { e.preventDefault(); handleDragEnd(); } : null;

      container.innerHTML = state.queue.map((track, idx) => {
        const isCur = track.id === state.currentTrack.id;
        const isDraggingThis = track.id === draggedTrackId;
        return `
          <div ${isDesktop ? 'draggable="true"' : ''} data-id="${track.id}" onclick="playTrack(${track.id})" class="queue-item group flex items-center gap-3 px-3.5 py-2.5 rounded-2xl hover:bg-white/10 cursor-grab active:cursor-grabbing transition-colors duration-150 ${isCur ? 'bg-white/[0.12]' : ''} ${isDraggingThis ? 'dragging-active' : ''}">
             <div class="hidden lg:flex w-5 justify-center text-gray-400 opacity-60 group-hover:opacity-100 hover:text-white transition-opacity">
               <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
             </div>
             <div class="relative w-10 h-10 sm:w-11 sm:h-11 rounded-xl shadow flex-shrink-0 overflow-hidden bg-white/5">
               <img src="${track.image}" alt="${track.title}" loading="lazy" decoding="async" class="w-full h-full object-cover" onerror="handleImgError(this)">
               ${isCur ? (state.isPlaying ? '<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></div>' : '<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>') : '<div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>'}
             </div>
             <div class="flex flex-col flex-1 min-w-0">
               <div class="text-[13px] sm:text-[14px] truncate ${isCur ? 'active-track-title' : 'text-gray-200 font-medium'}">${track.title}</div>
               <div class="text-[11px] sm:text-[12px] truncate text-gray-500 mt-0.5">${track.artist}</div>
             </div>
             <div class="queue-interactive flex lg:hidden items-center gap-1 text-gray-500" onclick="event.stopPropagation()">
               <button type="button" onclick="moveQueueItem(${idx}, -1)" class="p-1.5 hover:text-white active:scale-90"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg></button>
               <button type="button" onclick="moveQueueItem(${idx}, 1)" class="p-1.5 hover:text-white active:scale-90"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg></button>
             </div>
             <div class="text-xs tabular-nums text-gray-500 w-9 text-right">${track.duration}</div>
          </div>
        `;
      }).join('');

      if (isDesktop) {
        const items = container.querySelectorAll('.queue-item');
        items.forEach(item => {
          item.addEventListener('dragstart', handleDragStart);
          item.addEventListener('dragend', handleDragEnd);
        });
      }
    }

    window.onload = init;
  </script>   
</body>
</html>
